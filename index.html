<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POT Dino Location</title>
  <style>
    :root {
      --bg: #091220;
      --bg-soft: #101c30;
      --panel: rgba(17, 24, 39, 0.96);
      --panel-strong: rgba(13, 18, 31, 0.98);
      --panel-alt: #141f34;
      --card: rgba(15, 21, 35, 0.9);
      --border: rgba(148, 163, 184, 0.2);
      --border-strong: rgba(124, 156, 255, 0.42);
      --text: #edf4ff;
      --muted: #b6c4dc;
      --accent: #7c9cff;
      --accent-strong: #5b7ff7;
      --success: #5fe3a1;
      --danger: #ff6a7b;
      --warning: #f7c86b;
      --shadow: rgba(0, 0, 0, 0.38);
      --discord: #5865F2;
      --discord-dark: #4752c4;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(124, 156, 255, 0.12), transparent 35%),
        linear-gradient(180deg, #091220 0%, #0e1728 100%);
      color: var(--text);
    }
    body { min-height: 100vh; }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(9, 18, 32, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.25rem;
    }
    .topbar-inner {
      max-width: 1500px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .brand { display: inline-flex; align-items: center; gap: 0.8rem; }
    .brand-logo { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; border: 1px solid var(--border); box-shadow: 0 12px 24px rgba(0,0,0,0.22); }
    .brand-copy { display: flex; flex-direction: column; gap: 0.15rem; }
    .brand-copy h1 { margin: 0; font-size: 1.18rem; letter-spacing: 0.04em; }
    .brand-copy p { margin: 0; color: var(--muted); font-size: 0.76rem; }
    .header-actions { display: flex; gap: 0.7rem; flex-wrap: wrap; align-items: center; }
    .header-status { color: var(--success); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; min-height: 1rem; white-space: nowrap; }

    .btn, .btn-ghost, .btn-danger {
      white-space: nowrap;
      border-radius: 10px;
      padding: 0.72rem 1rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: transform 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn {
      background: linear-gradient(180deg, var(--accent), var(--accent-strong));
      border-color: var(--border-strong);
      color: #07111d;
      box-shadow: 0 10px 18px rgba(92, 123, 255, 0.28);
    }
    .btn-ghost {
      background: rgba(124, 156, 255, 0.08);
      color: var(--text);
      border-color: rgba(124, 156, 255, 0.22);
    }
    .discord-btn {
      background: var(--discord);
      border-color: var(--discord-dark);
      color: #ffffff;
      box-shadow: 0 10px 18px rgba(88, 101, 242, 0.25);
    }
    .btn-danger {
      background: rgba(255, 106, 123, 0.08);
      border-color: rgba(255, 106, 123, 0.35);
      color: #ffd7dd;
    }
    .btn:hover, .btn-ghost:hover, .discord-btn:hover, .btn-danger:hover { transform: translateY(-1px); }

    .page-shell {
      max-width: 1500px;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(320px, 1fr);
      gap: 1.25rem;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 18px 36px var(--shadow);
      overflow: hidden;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1rem 0.8rem;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }
    .panel-header h2 { margin: 0; font-size: 1.08rem; letter-spacing: 0.04em; }

    .map-panel { display: flex; flex-direction: column; min-height: 760px; }
    .map-frame { padding: 1rem; background: rgba(255, 255, 255, 0.01); }
    .map-view { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--border); min-height: 560px; background: rgba(7, 15, 24, 0.95); }
    .map-layer { position: relative; width: 100%; min-height: 560px; display: flex; align-items: center; justify-content: center; background: #071420; cursor: crosshair; }
    .map-image { width: 100%; min-height: 560px; object-fit: contain; pointer-events: none; user-select: none; transform-origin: center center; transition: transform 0.15s ease; }
    .zoom-controls { position: absolute; top: 1rem; right: 1rem; z-index: 10; display: flex; flex-direction: column; gap: 0.5rem; background: rgba(9, 18, 32, 0.72); border: 1px solid var(--border); border-radius: 12px; padding: 0.45rem; }
    .zoom-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: rgba(16, 28, 48, 0.9); color: var(--text); cursor: pointer; font-size: 1.25rem; }
    .marker { position: absolute; width: 14px; height: 14px; border-radius: 50%; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,0.9); box-shadow: 0 0 12px rgba(0,0,0,0.7); z-index: 2; }

    .map-form { display: grid; grid-template-columns: 1.2fr 1.8fr auto; gap: 0.75rem; padding: 1rem; border-top: 1px solid var(--border); background: rgba(255,255,255,0.01); align-items: end; }
    .field { display: flex; flex-direction: column; gap: 0.38rem; }
    .field label { color: var(--muted); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .field select, .field input { width: 100%; border-radius: 10px; border: 1px solid var(--border); background: rgba(8, 17, 29, 0.95); color: var(--text); padding: 0.82rem 0.9rem; }
    .field input::placeholder { color: rgba(182, 196, 220, 0.7); }

    .map-list { padding: 0 1rem 1rem; }
    .entry-list { display: flex; flex-direction: column; gap: 0.7rem; max-height: 220px; overflow-y: auto; }
    .entry-card { display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; background: rgba(8, 17, 29, 0.8); border-left: 4px solid var(--accent); border-radius: 10px; padding: 0.7rem 0.8rem; }
    .entry-card h4 { margin: 0 0 0.2rem; font-size: 0.96rem; }
    .entry-card p { margin: 0; color: var(--muted); font-size: 0.76rem; line-height: 1.5; }
    .entry-card button { background: transparent; color: var(--muted); border: none; font-size: 1.3rem; cursor: pointer; }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(2, 6, 15, 0.73);
      z-index: 50;
      padding: 1rem;
    }
    .modal.visible { display: flex; }
    .modal-card { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 1.2rem; box-shadow: 0 26px 60px rgba(0,0,0,0.35); }
    .modal-card h3 { margin-top: 0; margin-bottom: 0.5rem; }
    .modal-card p { color: var(--muted); margin: 0 0 1rem; line-height: 1.5; }
    .account-mode-switch { display: flex; gap: 0.6rem; margin-bottom: 0.9rem; border: 1px solid var(--border); border-radius: 10px; padding: 0.3rem; background: rgba(8,17,29,0.8); }
    .account-mode-btn { flex: 1; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--muted); padding: 0.7rem 0.8rem; cursor: pointer; font-weight: 700; }
    .account-mode-btn.active { background: rgba(124, 156, 255, 0.12); border-color: rgba(124, 156, 255, 0.25); color: var(--text); }
    .modal-form { display: flex; flex-direction: column; gap: 0.8rem; }
    .account-form { display: none; }
    .account-form.active { display: flex; }
    .status { min-height: 1.2rem; font-size: 0.8rem; color: var(--muted); }
    .status.error { color: #ffb1bd; }
    .status.success { color: #9af0c7; }

    @media (max-width: 980px) { .page-shell { grid-template-columns: 1fr; } }
    @media (max-width: 720px) { .map-form { grid-template-columns: 1fr; } .brand-copy h1 { font-size: 1rem; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img class="brand-logo" src="./logo.jpg" alt="POT Dino Location logo" />
        <div class="brand-copy">
          <h1>POT Dino Location</h1>
          <p>Gondwa map and community bulletin board</p>
        </div>
      </div>

      <div class="header-actions">
        <button id="createAccountBtn" class="btn-ghost" type="button">Create account</button>
        <button id="loginAccountBtn" class="btn-ghost" type="button">Log in</button>
        <button id="logoutBtn" class="btn-ghost" type="button" style="display:none;">Log out</button>
        <div id="headerAccountStatus" class="header-status" aria-live="polite"></div>
        <a class="btn-ghost discord-btn" href="https://discord.gg/BCmyrTVfe" target="_blank" rel="noopener noreferrer">Discord</a>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section class="panel map-panel" aria-label="Map panel">
      <div class="panel-header">
        <h2>Gondwa map</h2>
      </div>

      <div class="map-frame">
        <div class="map-view" id="mapView">
          <div class="zoom-controls" aria-label="zoom controls">
            <button type="button" class="zoom-btn" id="zoomInBtn" aria-label="Zoom in">+</button>
            <button type="button" class="zoom-btn" id="zoomOutBtn" aria-label="Zoom out">−</button>
            <button type="button" class="zoom-btn" id="zoomResetBtn" aria-label="Reset zoom">↺</button>
          </div>
          <div class="map-layer" id="mapLayer">
            <img class="map-image" src="./gondwa-map.jpg" alt="Gondwa map" />
          </div>
        </div>
      </div>

      <div class="map-form">
        <div class="field">
          <label for="dinoSelect">Dinosaur</label>
          <select id="dinoSelect">
            <optgroup label="Carnivores">
              <option value="Achillobator">Achillobator</option>
              <option value="Alioramus">Alioramus</option>
              <option value="Allosaurus">Allosaurus</option>
              <option value="Ceratosaurus">Ceratosaurus</option>
              <option value="Concavenator">Concavenator</option>
              <option value="Daspletosaurus">Daspletosaurus</option>
              <option value="Deinonychus">Deinonychus</option>
              <option value="Latenivenatrix">Latenivenatrix</option>
              <option value="Megalania">Megalania</option>
              <option value="Metriacanthosaurus">Metriacanthosaurus</option>
              <option value="Pycnonemosaurus">Pycnonemosaurus</option>
              <option value="Sarcosuchus">Sarcosuchus</option>
              <option value="Spinosaurus">Spinosaurus</option>
              <option value="Suchomimus">Suchomimus</option>
              <option value="Tyrannosaurus">Tyrannosaurus</option>
              <option value="Tyrannotitan">Tyrannotitan</option>
            </optgroup>
            <optgroup label="Herbivores">
              <option value="Albertaceratops">Albertaceratops</option>
              <option value="Amargasaurus">Amargasaurus</option>
              <option value="Anodontosaurus">Anodontosaurus</option>
              <option value="Barsboldia">Barsboldia</option>
              <option value="Camptosaurus">Camptosaurus</option>
              <option value="Deinocheirus">Deinocheirus</option>
              <option value="Eotriceratops">Eotriceratops</option>
              <option value="Iguanodon">Iguanodon</option>
              <option value="Kentrosaurus">Kentrosaurus</option>
              <option value="Lambeosaurus">Lambeosaurus</option>
              <option value="Miragaia">Miragaia</option>
              <option value="Pachycephalosaurus">Pachycephalosaurus</option>
              <option value="Stegosaurus">Stegosaurus</option>
              <option value="Struthiomimus">Struthiomimus</option>
              <option value="Styracosaurus">Styracosaurus</option>
            </optgroup>
            <optgroup label="Aquatic Creatures">
              <option value="Eurhinosaurus">Eurhinosaurus</option>
              <option value="Kaiwhekea">Kaiwhekea</option>
              <option value="Tylosaurus">Tylosaurus</option>
            </optgroup>
            <optgroup label="Flying Creatures">
              <option value="Hatzegopteryx">Hatzegopteryx</option>
              <option value="Rhamphorhynchus">Rhamphorhynchus</option>
              <option value="Thalassodromeus">Thalassodromeus</option>
            </optgroup>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="notesInput">Notes</label>
          <input id="notesInput" type="text" placeholder="Example: Adult female near the crater" />
        </div>

        <button id="saveMarkerBtn" class="btn" type="button">Save marker</button>
      </div>

      <div class="map-list">
        <div id="entriesList" class="entry-list" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <div id="accountModal" class="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="accountTitle">
      <h3 id="accountTitle">Account access</h3>
      <p>Save your map entries to your own account and load them later.</p>

      <div class="account-mode-switch" aria-label="account mode switch">
        <button type="button" class="account-mode-btn active" data-account-mode="login">Log in</button>
        <button type="button" class="account-mode-btn" data-account-mode="create">Create account</button>
      </div>

      <form id="loginForm" class="modal-form account-form active">
        <div class="field">
          <label for="loginUsername">Username</label>
          <input id="loginUsername" type="text" placeholder="Your username" required />
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" placeholder="Your password" required />
        </div>

        <button type="submit" class="btn">Log in</button>
      </form>

      <form id="createAccountForm" class="modal-form account-form">
        <div class="field">
          <label for="createUsername">Username</label>
          <input id="createUsername" type="text" placeholder="Choose a username" required />
        </div>

        <div class="field">
          <label for="createPassword">Password</label>
          <input id="createPassword" type="password" placeholder="Choose a password" required />
        </div>

        <div class="field">
          <label for="createConfirmPassword">Confirm password</label>
          <input id="createConfirmPassword" type="password" placeholder="Repeat password" required />
        </div>

        <button type="submit" class="btn">Create account</button>
      </form>

      <div id="accountStatus" class="status" aria-live="polite"></div>
    </div>
  </div>

  <script>
    (function () {
      const MAP_KEY = 'pot_dino_map_entries';
      const ACCOUNTS_KEY = 'pot_accounts';
      const ACTIVE_ACCOUNT_KEY = 'pot_active_account';
      const BOARD_ALLOWED_USERNAME = 'zizi';

      const mapLayer = document.getElementById('mapLayer');
      const entriesList = document.getElementById('entriesList');
      const dinoSelect = document.getElementById('dinoSelect');
      const notesInput = document.getElementById('notesInput');
      const saveMarkerBtn = document.getElementById('saveMarkerBtn');
      const zoomInBtn = document.getElementById('zoomInBtn');
      const zoomOutBtn = document.getElementById('zoomOutBtn');
      const zoomResetBtn = document.getElementById('zoomResetBtn');
      const accountModal = document.getElementById('accountModal');
      const accountStatus = document.getElementById('accountStatus');
      const createAccountBtn = document.getElementById('createAccountBtn');
      const loginAccountBtn = document.getElementById('loginAccountBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const headerAccountStatus = document.getElementById('headerAccountStatus');
      const loginForm = document.getElementById('loginForm');
      const createAccountForm = document.getElementById('createAccountForm');
      const accountModeButtons = document.querySelectorAll('.account-mode-btn');
      const loginUsername = document.getElementById('loginUsername');
      const loginPassword = document.getElementById('loginPassword');
      const createUsername = document.getElementById('createUsername');
      const createPassword = document.getElementById('createPassword');
      const createConfirmPassword = document.getElementById('createConfirmPassword');

      let mapEntries = loadMapEntries();
      let mapZoom = 1;

      function normalizeUsername(value) {
        return String(value || '').trim().toLowerCase();
      }

      function isBoardEditor() {
        const activeAccount = getActiveAccount();
        return Boolean(activeAccount) && normalizeUsername(activeAccount.username) === BOARD_ALLOWED_USERNAME;
      }

      function requireBoardEditor(actionDescription) {
        if (!isBoardEditor()) {
          setAccountStatus(`Only the user "Zizi" can ${actionDescription}.`, 'error');
          showAccountMode('login');
          openModal(accountModal);
          return false;
        }
        return true;
      }

      function openModal(modal) {
        modal.classList.add('visible');
        modal.setAttribute('aria-hidden', 'false');
      }

      function closeModal(modal) {
        modal.classList.remove('visible');
        modal.setAttribute('aria-hidden', 'true');
      }

      function setAccountStatus(message, type) {
        accountStatus.textContent = message || '';
        accountStatus.classList.remove('error', 'success');
        if (type === 'error') accountStatus.classList.add('error');
        if (type === 'success') accountStatus.classList.add('success');
      }

      function getActiveAccount() {
        try {
          const parsed = JSON.parse(localStorage.getItem(ACTIVE_ACCOUNT_KEY) || 'null');
          if (parsed && parsed.id && parsed.username) {
            return parsed;
          }
        } catch (error) {
          return null;
        }
        return null;
      }

      function setActiveAccount(account) {
        localStorage.setItem(ACTIVE_ACCOUNT_KEY, JSON.stringify(account));
        updateAccountButtons();
      }

      function clearActiveAccount() {
        localStorage.removeItem(ACTIVE_ACCOUNT_KEY);
        updateAccountButtons();
      }

      function getAccountStorageKey(accountId) {
        return `pot_dino_map_entries_${accountId}`;
      }

      function updateAccountButtons() {
        const activeAccount = getActiveAccount();
        const hasAccount = Boolean(activeAccount);

        loginAccountBtn.textContent = hasAccount ? `My account: ${activeAccount.username}` : 'Log in';
        createAccountBtn.textContent = hasAccount ? 'Switch account' : 'Create account';
        logoutBtn.style.display = hasAccount ? 'inline-flex' : 'none';
        headerAccountStatus.textContent = hasAccount ? `Logged in as ${activeAccount.username}` : '';
      }

      function loadMapEntries() {
        const activeAccount = getActiveAccount();
        const key = activeAccount ? getAccountStorageKey(activeAccount.id) : MAP_KEY;

        try {
          const parsed = JSON.parse(localStorage.getItem(key) || '[]');
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          return [];
        }
      }

      function saveMapEntries() {
        const activeAccount = getActiveAccount();
        const key = activeAccount ? getAccountStorageKey(activeAccount.id) : MAP_KEY;
        localStorage.setItem(key, JSON.stringify(mapEntries));
      }

      function readAccounts() {
        try {
          return JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || '{}');
        } catch (error) {
          return {};
        }
      }

      function writeAccounts(accounts) {
        localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts));
      }

      function renderMapMarkers() {
        document.querySelectorAll('.map-marker').forEach((marker) => marker.remove());

        mapEntries.forEach((entry) => {
          const marker = document.createElement('div');
          marker.className = 'marker map-marker';
          marker.style.left = `${entry.x}%`;
          marker.style.top = `${entry.y}%`;
          marker.style.backgroundColor = entry.color || '#7c9cff';
          marker.title = `${entry.dino}${entry.notes ? ` — ${entry.notes}` : ''}`;
          mapLayer.appendChild(marker);
        });
      }

      function renderEntriesList() {
        entriesList.innerHTML = '';

        if (!mapEntries.length) {
          entriesList.innerHTML = '<div class="board-empty">No markers yet. Click anywhere on the map to add one.</div>';
          return;
        }

        mapEntries.forEach((entry, index) => {
          const card = document.createElement('div');
          card.className = 'entry-card';
          card.style.borderLeftColor = entry.color || '#7c9cff';

          const info = document.createElement('div');
          const title = document.createElement('h4');
          title.textContent = entry.dino;

          const meta = document.createElement('p');
          meta.textContent = `X: ${Number(entry.x).toFixed(1)}% • Y: ${Number(entry.y).toFixed(1)}%`;

          const note = document.createElement('p');
          note.textContent = entry.notes ? `“${entry.notes}”` : 'No notes';

          info.append(title, meta, note);

          const removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.textContent = '×';
          removeBtn.title = 'Delete marker';
          removeBtn.addEventListener('click', () => {
            mapEntries.splice(index, 1);
            saveMapEntries();
            renderMapMarkers();
            renderEntriesList();
          });

          card.append(info, removeBtn);
          entriesList.appendChild(card);
        });
      }

      function saveMapMarkerFromClick(clientX, clientY) {
        const activeAccount = getActiveAccount();
        if (!activeAccount) {
          setAccountStatus('Please create an account or log in before saving entries.', 'error');
          showAccountMode('login');
          openModal(accountModal);
          return;
        }

        const saveConfirmed = window.confirm('Save this entry to your account?');
        if (!saveConfirmed) return;

        const rect = mapLayer.getBoundingClientRect();
        const xPercent = ((clientX - rect.left) / rect.width) * 100;
        const yPercent = ((clientY - rect.top) / rect.height) * 100;

        const selectedDino = dinoSelect.value || 'Other';
        const selectedNotes = notesInput.value.trim();
        const palette = {
          Achillobator: '#f87171',
          Alioramus: '#ef4444',
          Allosaurus: '#ef4444',
          Ceratosaurus: '#f472b6',
          Concavenator: '#f59e0b',
          Daspletosaurus: '#f97316',
          Deinonychus: '#2dd4bf',
          Latenivenatrix: '#60a5fa',
          Megalania: '#a78bfa',
          Metriacanthosaurus: '#22c55e',
          Pycnonemosaurus: '#f59e0b',
          Sarcosuchus: '#f43f5e',
          Spinosaurus: '#22c55e',
          Suchomimus: '#f59e0b',
          Tyrannosaurus: '#f87171',
          Tyrannotitan: '#f97316',
          Albertaceratops: '#a78bfa',
          Amargasaurus: '#c084fc',
          Anodontosaurus: '#22c55e',
          Barsboldia: '#2dd4bf',
          Camptosaurus: '#facc15',
          Deinocheirus: '#60a5fa',
          Eotriceratops: '#a78bfa',
          Iguanodon: '#60a5fa',
          Kentrosaurus: '#f59e0b',
          Lambeosaurus: '#2dd4bf',
          Miragaia: '#22c55e',
          Pachycephalosaurus: '#f59e0b',
          Stegosaurus: '#a78bfa',
          Struthiomimus: '#22c55e',
          Styracosaurus: '#f59e0b',
          Eurhinosaurus: '#60a5fa',
          Kaiwhekea: '#38bdf8',
          Tylosaurus: '#2dd4bf',
          Hatzegopteryx: '#f472b6',
          Rhamphorhynchus: '#f59e0b',
          Thalassodromeus: '#a78bfa',
          Other: '#7c9cff'
        };

        mapEntries.push({
          dino: selectedDino,
          notes: selectedNotes,
          x: Math.min(Math.max(xPercent, 2), 98),
          y: Math.min(Math.max(yPercent, 2), 98),
          color: palette[selectedDino] || '#7c9cff'
        });

        saveMapEntries();
        renderMapMarkers();
        renderEntriesList();
      }

      function showAccountMode(mode) {
        const isCreate = mode === 'create';
        loginForm.classList.toggle('active', !isCreate);
        createAccountForm.classList.toggle('active', isCreate);
        accountModeButtons.forEach((button) => {
          const isSelected = button.dataset.accountMode === mode;
          button.classList.toggle('active', isSelected);
        });
      }

      createAccountBtn.addEventListener('click', () => {
        setAccountStatus('', '');
        showAccountMode('create');
        openModal(accountModal);
      });

      loginAccountBtn.addEventListener('click', () => {
        setAccountStatus('', '');
        showAccountMode('login');
        openModal(accountModal);
      });

      logoutBtn.addEventListener('click', () => {
        clearActiveAccount();
        setAccountStatus('Logged out.', 'success');
      });

      loginForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const username = normalizeUsername(loginUsername.value);
        const password = loginPassword.value.trim();

        if (!username || !password) {
          setAccountStatus('Please fill in both username and password.', 'error');
          return;
        }

        const accounts = readAccounts();
        const storedUser = accounts[username];

        if (!storedUser || storedUser.password !== password) {
          setAccountStatus('Invalid username or password.', 'error');
          return;
        }

        const account = { id: storedUser.id || username, username: storedUser.username || username };
        setActiveAccount(account);
        setAccountStatus('Logged in successfully.', 'success');
        closeModal(accountModal);
      });

      createAccountForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const username = normalizeUsername(createUsername.value);
        const password = createPassword.value;
        const confirmPassword = createConfirmPassword.value;

        if (!username || !password) {
          setAccountStatus('Username and password are required.', 'error');
          return;
        }

        if (password !== confirmPassword) {
          setAccountStatus('Passwords do not match.', 'error');
          return;
        }

        const accounts = readAccounts();
        if (accounts[username]) {
          setAccountStatus('That username already exists.', 'error');
          return;
        }

        accounts[username] = {
          id: username,
          username,
          password
        };
        writeAccounts(accounts);

        const account = { id: username, username };
        setActiveAccount(account);
        setAccountStatus('Account created successfully.', 'success');
        closeModal(accountModal);
      });

      accountModeButtons.forEach((button) => {
        button.addEventListener('click', () => {
          showAccountMode(button.dataset.accountMode);
        });
      });

      saveMarkerBtn.addEventListener('click', () => {
        const activeAccount = getActiveAccount();
        if (!activeAccount) {
          setAccountStatus('Please create an account or log in before saving entries.', 'error');
          showAccountMode('login');
          openModal(accountModal);
          return;
        }
        const hasMarker = dinoSelect.value || notesInput.value.trim();
        if (!hasMarker) {
          setAccountStatus('Choose a dinosaur before saving a marker.', 'error');
          return;
        }
        saveMapMarkerFromClick(mapLayer.getBoundingClientRect().left + 10, mapLayer.getBoundingClientRect().top + 10);
      });

      mapLayer.addEventListener('click', (event) => {
        const activeAccount = getActiveAccount();
        if (!activeAccount) {
          setAccountStatus('Please create an account or log in before saving entries.', 'error');
          showAccountMode('login');
          openModal(accountModal);
          return;
        }
        saveMapMarkerFromClick(event.clientX, event.clientY);
      });

      zoomInBtn.addEventListener('click', () => {
        mapZoom = Math.min(mapZoom + 0.1, 2.2);
        mapLayer.style.transform = `scale(${mapZoom})`;
      });

      zoomOutBtn.addEventListener('click', () => {
        mapZoom = Math.max(mapZoom - 0.1, 0.8);
        mapLayer.style.transform = `scale(${mapZoom})`;
      });

      zoomResetBtn.addEventListener('click', () => {
        mapZoom = 1;
        mapLayer.style.transform = 'scale(1)';
      });

      accountModal.addEventListener('click', (event) => {
        if (event.target === accountModal) closeModal(accountModal);
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && accountModal.classList.contains('visible')) {
          closeModal(accountModal);
        }
      });

      renderMapMarkers();
      renderEntriesList();
      updateAccountButtons();
    })();
  </script>
</body>
</html>
