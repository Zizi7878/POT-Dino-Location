<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>POT Dino Location Bulletin Board</title>
    <style>
        :root {
            --bg: #0b1020;
            --panel: #121b2d;
            --panel-strong: #1a2940;
            --panel-soft: #111827;
            --border: #2a3b5d;
            --text: #edf2ff;
            --muted: #a9b7d0;
            --accent: #7c9cff;
            --accent-strong: #5877f2;
            --success: #38d39f;
            --warning: #f6c453;
            --danger: #ff5d73;
            --shadow: rgba(0, 0, 0, 0.38);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(180deg, #09111d 0%, #0f172a 100%);
            color: var(--text);
        }

        body {
            min-height: 100vh;
        }

        img {
            max-width: 100%;
            display: block;
        }

        button, input, textarea, select {
            font: inherit;
        }

        header {
            background: rgba(17, 24, 39, 0.95);
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.9rem;
        }

        .brand img {
            width: 58px;
            height: 58px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }

        .brand-copy {
            display: flex;
            flex-direction: column;
        }

        .brand-copy h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 0.02em;
        }

        .brand-copy p {
            margin: 0.2rem 0 0;
            font-size: 0.78rem;
            color: var(--muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .button,
        .secondary-button,
        .danger-button {
            padding: 0.72rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            color: var(--text);
            background: transparent;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .button {
            background: var(--accent);
            border-color: var(--accent);
            color: #08101d;
            font-weight: 700;
        }

        .secondary-button {
            background: rgba(124, 156, 255, 0.12);
        }

        .danger-button {
            color: #ffd9dd;
            border-color: rgba(255, 93, 115, 0.5);
            background: rgba(255, 93, 115, 0.08);
        }

        .button:hover,
        .secondary-button:hover,
        .danger-button:hover {
            transform: translateY(-1px);
        }

        .page-shell {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.25rem;
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) minmax(320px, 1fr);
            gap: 1.5rem;
        }

        .panel {
            background: rgba(18, 27, 45, 0.95);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 15px 30px var(--shadow);
            overflow: hidden;
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1rem 1rem 0.75rem;
            border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,0.02);
        }

        .panel-head h2 {
            margin: 0;
            font-size: 1.1rem;
        }

        .map-panel {
            display: flex;
            flex-direction: column;
            min-height: 720px;
        }

        .map-frame {
            position: relative;
            padding: 1rem;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.95));
        }

        .map-view {
            position: relative;
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            background: #08121f;
            min-height: 540px;
        }

        .map-layer {
            position: relative;
            width: 100%;
            min-height: 540px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #071421;
            touch-action: none;
            cursor: crosshair;
        }

        .map-image {
            width: 100%;
            height: 100%;
            min-height: 540px;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
        }

        .zoom-controls {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 2;
            background: rgba(15, 21, 33, 0.75);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.45rem;
            backdrop-filter: blur(4px);
        }

        .zoom-controls button {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(18, 27, 45, 0.8);
            color: var(--text);
            cursor: pointer;
            font-size: 1.25rem;
        }

        .marker {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255,255,255,0.9);
            box-shadow: 0 0 12px rgba(0,0,0,0.7);
            z-index: 1;
        }

        .map-form {
            display: grid;
            grid-template-columns: 1.5fr 2fr auto;
            gap: 0.75rem;
            padding: 1rem;
            align-items: end;
            border-top: 1px solid var(--border);
            background: rgba(255,255,255,0.01);
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .field label {
            color: var(--muted);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 700;
        }

        .field select,
        .field input,
        .field textarea,
        .field-file input {
            width: 100%;
            border-radius: 10px;
            background: #0b1120;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.8rem 0.9rem;
        }

        .field textarea {
            min-height: 110px;
            resize: vertical;
        }

        .field-file {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .field-file input {
            padding: 0.7rem 0.8rem;
        }

        .map-list {
            padding: 0 1rem 1rem;
        }

        .entry-list {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        .entry-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
            background: rgba(17, 24, 39, 0.8);
            border-left: 4px solid var(--accent);
            border-radius: 10px;
            padding: 0.75rem 0.8rem;
        }

        .entry-card h4 {
            margin: 0 0 0.2rem;
            font-size: 0.95rem;
        }

        .entry-card p {
            margin: 0;
            color: var(--muted);
            font-size: 0.76rem;
        }

        .entry-card button {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 1.3rem;
            cursor: pointer;
        }

        .board-panel {
            display: flex;
            flex-direction: column;
            min-height: 720px;
        }

        .board-content {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .board-empty {
            background: rgba(11, 17, 32, 0.9);
            border: 1px dashed var(--border);
            border-radius: 12px;
            padding: 1.4rem;
            color: var(--muted);
            text-align: center;
        }

        .board-posts {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .board-post {
            background: rgba(11, 17, 32, 0.88);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }

        .post-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.6rem;
        }

        .post-top h3 {
            margin: 0;
            font-size: 1.05rem;
        }

        .post-toolbar {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .tiny-button {
            padding: 0.5rem 0.7rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
            background: rgba(124, 156, 255, 0.09);
            color: var(--text);
            font-weight: 700;
        }

        .tiny-button.danger {
            border-color: rgba(255, 93, 115, 0.5);
            color: #ffd5dc;
          background: rgba(255, 93, 115, 0.06);
        }

        .board-post p {
            margin: 0.65rem 0 0;
            color: var(--text);
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .board-post img {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 0.85rem;
            border: 1px solid var(--border);
        }

        .admin-panel {
            background: rgba(124, 156, 255, 0.06);
            border: 1px solid rgba(124, 156, 255, 0.25);
            border-radius: 14px;
            padding: 1rem;
            display: none;
        }

        .admin-panel.visible {
            display: block;
        }

        .admin-panel h3 {
            margin-top: 0;
            margin-bottom: 0.8rem;
        }

        .admin-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .inline-note {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .media-preview {
            display: none;
            margin-top: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            max-height: 220px;
        }

        .media-preview.visible {
            display: block;
        }

        .media-preview img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
        }

        .hidden {
            display: none !important;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 15, 0.72);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 1rem;
        }

        .modal.visible {
            display: flex;
        }

        .modal-card {
            width: min(440px, 100%);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.2rem;
            box-shadow: 0 24px 65px rgba(0,0,0,0.35);
        }

        .modal-card h3 {
            margin-top: 0;
        }

        .modal-card p {
            color: var(--muted);
            line-height: 1.5;
        }

        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-top: 1rem;
        }

        .status {
            min-height: 1.2rem;
            color: var(--muted);
            font-size: 0.8rem;
        }

        .status.error {
            color: #ff9aa6;
        }

        .status.success {
            color: #93f0c4;
        }

        @media (max-width: 980px) {
            .page-shell {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 700px) {
            .map-form {
                grid-template-columns: 1fr;
            }

            .brand-copy h1 {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <img src="./logo.jpg" alt="POT Dino Location logo">
            <div class="brand-copy">
                <h1>POT Dino Location</h1>
                <p>Gondwa map and bulletin board</p>
            </div>
        </div>

        <div class="header-actions">
            <a class="secondary-button" href="#board-panel">Bulletin Board</a>
            <button id="adminAccessBtn" class="button" type="button">Admin access</button>
        </div>
    </header>

    <main class="page-shell">
        <section class="panel map-panel" aria-label="Map panel">
            <div class="panel-head">
                <h2>Gondwa map</h2>
            </div>

            <div class="map-frame">
                <div class="map-view" id="mapView">
                    <div class="zoom-controls" aria-label="Map zoom controls">
                        <button type="button" id="zoomInBtn" aria-label="Zoom in">+</button>
                        <button type="button" id="zoomOutBtn" aria-label="Zoom out">−</button>
                        <button type="button" id="zoomResetBtn" aria-label="Reset zoom">↺</button>
                    </div>
                    <div class="map-layer" id="mapLayer">
                        <img class="map-image" src="./gondwa-map.jpg" alt="Gondwa map">
                    </div>
                </div>
            </div>

            <div class="map-form">
                <div class="field">
                    <label for="dinoSelect">Dinosaur</label>
                    <select id="dinoSelect">
                        <option value="Achillobator">Achillobator</option>
                        <option value="Allosaurus">Allosaurus</option>
                        <option value="Spinosaurus">Spinosaurus</option>
                        <option value="Tyrannosaurus Rex">Tyrannosaurus Rex</option>
                        <option value="Iguanodon">Iguanodon</option>
                        <option value="Stegosaurus">Stegosaurus</option>
                        <option value="Hatzegopteryx">Hatzegopteryx</option>
                        <option value="Tylosaurus">Tylosaurus</option>
                        <option value="Trike (Eotriceratops)">Trike</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="field">
                    <label for="notesInput">Notes</label>
                    <input id="notesInput" type="text" placeholder="Example: Adult female near the crater">
                </div>

                <button id="saveMarkerBtn" class="button" type="button">Save marker</button>
            </div>

            <div class="map-list">
                <div class="entry-list" id="entriesList" aria-live="polite"></div>
            </div>
        </section>

        <aside class="panel board-panel" id="board-panel" aria-label="Bulletin board panel">
            <div class="panel-head">
                <h2>Bulletin board</h2>
                <button id="openBoardAdminBtn" class="secondary-button" type="button">Admin edit</button>
            </div>

            <div class="board-content">
                <div id="adminPanel" class="admin-panel" aria-live="polite">
                    <h3>Admin bulletin editor</h3>
                    <form id="postForm" class="admin-form">
                        <div class="field">
                            <label for="postTitle">Title</label>
                            <input id="postTitle" type="text" maxlength="80" placeholder="Announcement title">
                        </div>

                        <div class="field">
                            <label for="postText">Text</label>
                            <textarea id="postText" placeholder="Write your message here..."></textarea>
                        </div>

                        <div class="field">
                            <label for="postMedia">Add image or GIF</label>
                            <input id="postMedia" type="file" accept="image/*,.gif">
                            <div id="mediaPreview" class="media-preview" aria-live="polite"></div>
                        </div>

                        <div class="inline-note">Files are stored in the browser only for this site.</div>
                        <button class="button" type="submit">Publish post</button>
                    </form>
                </div>

                <div id="boardPosts" class="board-posts" aria-live="polite"></div>
            </div>
        </aside>
    </main>

    <div id="adminModal" class="modal" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
            <h3 id="adminTitle">Admin access</h3>
            <p>Only the authorized email can access the bulletin board editor.</p>

            <form id="adminForm" class="modal-form">
                <div class="field">
                    <label for="adminEmail">Email</label>
                    <input id="adminEmail" type="email" placeholder="name@example.com" required>
                </div>
                <button class="button" type="submit">Enter admin portal</button>
                <div id="adminStatus" class="status" aria-live="polite"></div>
            </form>
        </div>
    </div>

    <script>
        (function () {
            const ADMIN_EMAIL = 'zimaris.martinez@gmail.com';
            const boardStorageKey = 'pot_board_posts';
            const mapStorageKey = 'pot_dino_map_entries';
            const adminFlagKey = 'pot_admin_authorized';
            const adminEmailKey = 'pot_admin_email';

            const adminAccessBtn = document.getElementById('adminAccessBtn');
            const openBoardAdminBtn = document.getElementById('openBoardAdminBtn');
            const adminModal = document.getElementById('adminModal');
            const adminForm = document.getElementById('adminForm');
            const adminStatus = document.getElementById('adminStatus');
            const adminEmailInput = document.getElementById('adminEmail');
            const adminPanel = document.getElementById('adminPanel');
            const postForm = document.getElementById('postForm');
            const postTitle = document.getElementById('postTitle');
            const postText = document.getElementById('postText');
            const postMedia = document.getElementById('postMedia');
            const boardPosts = document.getElementById('boardPosts');
            const mediaPreview = document.getElementById('mediaPreview');
            const dinoSelect = document.getElementById('dinoSelect');
            const notesInput = document.getElementById('notesInput');
            const saveMarkerBtn = document.getElementById('saveMarkerBtn');
            const entriesList = document.getElementById('entriesList');
            const mapLayer = document.getElementById('mapLayer');
            const zoomInBtn = document.getElementById('zoomInBtn');
            const zoomOutBtn = document.getElementById('zoomOutBtn');
            const zoomResetBtn = document.getElementById('zoomResetBtn');

            let mapEntries = loadMapEntries();
            let boardEntries = loadBoardEntries();
            let adminAuthorized = isAdminAuthorized();
            let selectedMediaData = '';

            function normalizeEmail(value) {
                return String(value || '').trim().toLowerCase();
            }

            function isAdminAuthorized() {
                const storedFlag = localStorage.getItem(adminFlagKey) === 'true';
                const storedEmail = normalizeEmail(localStorage.getItem(adminEmailKey));
                return storedFlag && storedEmail === normalizeEmail(ADMIN_EMAIL);
            }

            function loadBoardEntries() {
                try {
                    const data = JSON.parse(localStorage.getItem(boardStorageKey) || '[]');
                    return Array.isArray(data) ? data : [];
                } catch (error) {
                    return [];
                }
            }

            function saveBoardEntries() {
                localStorage.setItem(boardStorageKey, JSON.stringify(boardEntries));
            }

            function loadMapEntries() {
                try {
                    const data = JSON.parse(localStorage.getItem(mapStorageKey) || '[]');
                    return Array.isArray(data) ? data : [];
                } catch (error) {
                    return [];
                }
            }

            function saveMapEntries() {
                localStorage.setItem(mapStorageKey, JSON.stringify(mapEntries));
            }

            function renderBoard() {
                boardPosts.innerHTML = '';

                if (!boardEntries.length) {
                    boardPosts.innerHTML = '<div class="board-empty">No bulletin board posts yet. Add a new update from the admin editor.</div>';
                    return;
                }

                const fragment = document.createDocumentFragment();

                boardEntries.forEach((post) => {
                    const card = document.createElement('article');
                    card.className = 'board-post';

                    const top = document.createElement('div');
                    top.className = 'post-top';

                    const title = document.createElement('h3');
                    title.textContent = post.title || 'Announcement';

                    const toolbar = document.createElement('div');
                    toolbar.className = 'post-toolbar';

                    if (adminAuthorized) {
                        const editButton = document.createElement('button');
                        editButton.type = 'button';
                        editButton.className = 'tiny-button';
                        editButton.textContent = 'Edit';
                        editButton.addEventListener('click', () => editPost(post.id));

                        const deleteButton = document.createElement('button');
                        deleteButton.type = 'button';
                        deleteButton.className = 'tiny-button danger';
                        deleteButton.textContent = 'Delete';
                        deleteButton.addEventListener('click', () => deletePost(post.id));

                        toolbar.append(editButton, deleteButton);
                    }

                    top.appendChild(title);
                    top.appendChild(toolbar);

                    const text = document.createElement('p');
                    text.textContent = post.text || '';

                    card.appendChild(top);
                    card.appendChild(text);

                    if (post.media) {
                        const image = document.createElement('img');
                        image.src = post.media;
                        image.alt = post.title || 'Uploaded media';
                        card.appendChild(image);
                    }

                    fragment.appendChild(card);
                });

                boardPosts.appendChild(fragment);
            }

            function renderEntries() {
                entriesList.innerHTML = '';

                if (!mapEntries.length) {
                    entriesList.innerHTML = '<div class="board-empty">No map markers yet. Click anywhere on the map to add one.</div>';
                    return;
                }

                mapEntries.forEach((entry, index) => {
                    const item = document.createElement('div');
                    item.className = 'entry-card';
                    item.style.borderLeftColor = entry.color || '#7c9cff';

                    const info = document.createElement('div');
                    const entryTitle = document.createElement('h4');
                    entryTitle.textContent = entry.dino;
                    const entryMeta = document.createElement('p');
                    entryMeta.textContent = `X: ${Number(entry.x).toFixed(1)}% • Y: ${Number(entry.y).toFixed(1)}%`;
                    const entryNotes = document.createElement('p');
                    entryNotes.textContent = entry.notes ? `“${entry.notes}”` : 'No notes';

                    info.append(entryTitle, entryMeta, entryNotes);

                    const removeButton = document.createElement('button');
                    removeButton.type = 'button';
                    removeButton.textContent = '×';
                    removeButton.title = 'Delete marker';
                    removeButton.addEventListener('click', () => {
                        mapEntries.splice(index, 1);
                        saveMapEntries();
                        renderMapMarkers();
                        renderEntries();
                    });

                    item.append(info, removeButton);
                    entriesList.appendChild(item);
                });
            }

            function renderMapMarkers() {
                document.querySelectorAll('.map-marker').forEach((marker) => marker.remove());

                mapEntries.forEach((entry) => {
                    const marker = document.createElement('div');
                    marker.className = 'marker map-marker';
                    marker.style.left = `${entry.x}%`;
                    marker.style.top = `${entry.y}%`;
                    marker.style.backgroundColor = entry.color || '#7c9cff';
                    marker.title = `${entry.dino}${entry.notes ? ` — ${entry.notes}` : ''}`;
                    mapLayer.appendChild(marker);
                });
            }

            function saveMapMarkerFromClick(clientX, clientY) {
                const rect = mapLayer.getBoundingClientRect();
                const xPercent = ((clientX - rect.left) / rect.width) * 100;
                const yPercent = ((clientY - rect.top) / rect.height) * 100;

                const selectedDino = dinoSelect.value || 'Other';
                const selectedNotes = notesInput.value.trim();
                const colors = {
                    Achillobator: '#f87171',
                    Allosaurus: '#ef4444',
                    Spinosaurus: '#22c55e',
                    'Tyrannosaurus Rex': '#f59e0b',
                    Iguanodon: '#60a5fa',
                    Stegosaurus: '#a78bfa',
                    'Trike (Eotriceratops)': '#c084fc',
                    Hatzegopteryx: '#f472b6',
                    Tylosaurus: '#2dd4bf',
                    Other: '#7c9cff'
                };

                mapEntries.push({
                    dino: selectedDino,
                    notes: selectedNotes,
                    x: Math.min(Math.max(xPercent, 2), 98),
                    y: Math.min(Math.max(yPercent, 2), 98),
                    color: colors[selectedDino] || '#7c9cff'
                });

                saveMapEntries();
                renderMapMarkers();
                renderEntries();
            }

            function buildBoardPreview() {
                if (!selectedMediaData) {
                    mediaPreview.classList.remove('visible');
                    mediaPreview.innerHTML = '';
                    return;
                }

                mediaPreview.classList.add('visible');
                mediaPreview.innerHTML = `<img src="${selectedMediaData}" alt="Selected media preview">`;
            }

            function openModal(modal) {
                modal.classList.add('visible');
                modal.setAttribute('aria-hidden', 'false');
            }

            function closeModal(modal) {
                modal.classList.remove('visible');
                modal.setAttribute('aria-hidden', 'true');
            }

            function toggleAdminPanel(show) {
                adminPanel.classList.toggle('visible', show);
            }

            function updateAdminStatus() {
                adminAuthorized = isAdminAuthorized();
                const adminButtonText = adminAuthorized ? 'Admin enabled' : 'Admin access';
                adminAccessBtn.textContent = adminButtonText;
                openBoardAdminBtn.textContent = adminAuthorized ? 'Admin edit' : 'Admin edit';
                toggleAdminPanel(adminAuthorized);
            }

            function handleAdminLogin(event) {
                event.preventDefault();
                const enteredEmail = normalizeEmail(adminEmailInput.value);

                if (enteredEmail !== normalizeEmail(ADMIN_EMAIL)) {
                    adminStatus.textContent = 'Access denied. This portal is only available for zimaris.martinez@gmail.com.';
                    adminStatus.classList.add('error');
                    adminStatus.classList.remove('success');
                    return;
                }

                localStorage.setItem(adminFlagKey, 'true');
                localStorage.setItem(adminEmailKey, ADMIN_EMAIL);
                adminStatus.textContent = 'Access granted.';
                adminStatus.classList.remove('error');
                adminStatus.classList.add('success');
                adminAuthorized = true;
                updateAdminStatus();

                setTimeout(() => {
                    closeModal(adminModal);
                    adminForm.reset();
                    adminStatus.textContent = '';
                    adminStatus.classList.remove('error', 'success');
                }, 500);
            }

            function addNewPost(event) {
                event.preventDefault();

                if (!adminAuthorized) {
                    openModal(adminModal);
                    adminStatus.textContent = 'Please sign in with the admin email to publish updates.';
                    adminStatus.classList.add('error');
                    return;
                }

                const title = postTitle.value.trim() || 'Announcement';
                const text = postText.value.trim();

                if (!text && !selectedMediaData) {
                    adminStatus.textContent = 'Please add text or an image before publishing.';
                    adminStatus.classList.add('error');
                    return;
                }

                const item = {
                    id: Date.now(),
                    title,
                    text,
                    media: selectedMediaData || ''
                };

                boardEntries.unshift(item);
                saveBoardEntries();
                renderBoard();

                postForm.reset();
                selectedMediaData = '';
                buildBoardPreview();
                adminStatus.textContent = 'Announcement published.';
                adminStatus.classList.remove('error');
                adminStatus.classList.add('success');
                setTimeout(() => {
                    adminStatus.textContent = '';
                    adminStatus.classList.remove('success');
                }, 1200);
            }

            function deletePost(postId) {
                boardEntries = boardEntries.filter((post) => post.id !== postId);
                saveBoardEntries();
                renderBoard();
            }

            function editPost(postId) {
                const post = boardEntries.find((entry) => entry.id === postId);
                if (!post) return;

                postTitle.value = post.title || '';
                postText.value = post.text || '';
                selectedMediaData = post.media || '';
                buildBoardPreview();
                toggleAdminPanel(true);
                postTitle.focus();

                if (post.media) {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }

            function handleMediaUpload(event) {
                const file = event.target.files && event.target.files[0];
                if (!file) {
                    selectedMediaData = '';
                    buildBoardPreview();
                    return;
                }

                if (!file.type.startsWith('image/')) {
                    adminStatus.textContent = 'Only image or GIF files are supported.';
                    adminStatus.classList.add('error');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function () {
                    selectedMediaData = reader.result;
                    buildBoardPreview();
                    adminStatus.textContent = '';
                    adminStatus.classList.remove('error');
                };
                reader.readAsDataURL(file);
            }

            function setupMapZoom() {
                let zoomLevel = 1;
                const minZoom = 0.75;
                const maxZoom = 2.5;
                const step = 0.25;

                function applyZoom() {
                    const mapImage = document.querySelector('.map-image');
                    if (!mapImage) return;
                    mapImage.style.transform = `scale(${zoomLevel})`;
                }

                zoomInBtn.addEventListener('click', () => {
                    zoomLevel = Math.min(zoomLevel + step, maxZoom);
                    applyZoom();
                });

                zoomOutBtn.addEventListener('click', () => {
                    zoomLevel = Math.max(zoomLevel - step, minZoom);
                    applyZoom();
                });

                zoomResetBtn.addEventListener('click', () => {
                    zoomLevel = 1;
                    applyZoom();
                });
            }

            adminAccessBtn.addEventListener('click', () => openModal(adminModal));
            openBoardAdminBtn.addEventListener('click', () => {
                if (!adminAuthorized) {
                    openModal(adminModal);
                    return;
                }
                toggleAdminPanel(true);
                postTitle.focus();
            });
            adminForm.addEventListener('submit', handleAdminLogin);
            postForm.addEventListener('submit', addNewPost);
            postMedia.addEventListener('change', handleMediaUpload);

            saveMarkerBtn.addEventListener('click', () => {
                const rect = mapLayer.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                saveMapMarkerFromClick(centerX, centerY);
            });

            mapLayer.addEventListener('click', (event) => saveMapMarkerFromClick(event.clientX, event.clientY));

            document.querySelectorAll('.modal').forEach((modal) => {
                modal.addEventListener('click', (event) => {
                    if (event.target === modal) {
                        closeModal(modal);
                    }
                });
            });

            renderMapMarkers();
            renderEntries();
            renderBoard();
            updateAdminStatus();
            setupMapZoom();
        })();
    </script>
</body>
</html>
