<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POT Dino Location</title>
  <style>
    :root {
      --bg: #091220;
      --bg-soft: #101c30;
      --panel: rgba(17, 24, 39, 0.96);
      --panel-strong: rgba(13, 18, 31, 0.98);
      --panel-alt: #141f34;
      --card: rgba(15, 21, 35, 0.9);
      --border: rgba(148, 163, 184, 0.2);
      --border-strong: rgba(124, 156, 255, 0.42);
      --text: #edf4ff;
      --muted: #b6c4dc;
      --accent: #7c9cff;
      --accent-strong: #5b7ff7;
      --success: #5fe3a1;
      --danger: #ff6a7b;
      --warning: #f7c86b;
      --shadow: rgba(0, 0, 0, 0.38);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(124, 156, 255, 0.12), transparent 35%),
        linear-gradient(180deg, #091220 0%, #0e1728 100%);
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(9, 18, 32, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.25rem;
    }

    .topbar-inner {
      max-width: 1500px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
    }

    .brand-logo {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid var(--border);
      box-shadow: 0 12px 24px rgba(0,0,0,0.22);
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .brand-copy h1 {
      margin: 0;
      font-size: 1.18rem;
      letter-spacing: 0.04em;
    }

    .brand-copy p {
      margin: 0;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .header-actions {
      display: flex;
      gap: 0.7rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn,
    .btn-ghost,
    .btn-danger {
      white-space: nowrap;
      border-radius: 10px;
      padding: 0.72rem 1rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn {
      background: linear-gradient(180deg, var(--accent), var(--accent-strong));
      border-color: var(--border-strong);
      color: #07111d;
      box-shadow: 0 10px 18px rgba(92, 123, 255, 0.28);
    }

    .btn-ghost {
      background: rgba(124, 156, 255, 0.08);
      color: var(--text);
      border-color: rgba(124, 156, 255, 0.22);
    }

    .btn-danger {
      background: rgba(255, 106, 123, 0.08);
      border-color: rgba(255, 106, 123, 0.35);
      color: #ffd7dd;
    }

    .btn:hover, .btn-ghost:hover, .btn-danger:hover {
      transform: translateY(-1px);
    }

    .page-shell {
      max-width: 1500px;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(320px, 1fr);
      gap: 1.25rem;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 18px 36px var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1rem 0.8rem;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1.08rem;
      letter-spacing: 0.04em;
    }

    .map-panel {
      display: flex;
      flex-direction: column;
      min-height: 760px;
    }

    .map-frame {
      padding: 1rem;
      background: rgba(255, 255, 255, 0.01);
    }

    .map-view {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      min-height: 560px;
      background: rgba(7, 15, 24, 0.95);
    }

    .map-layer {
      position: relative;
      width: 100%;
      min-height: 560px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #071420;
      cursor: crosshair;
    }

    .map-image {
      width: 100%;
      min-height: 560px;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      transform-origin: center center;
      transition: transform 0.15s ease;
    }

    .zoom-controls {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: rgba(9, 18, 32, 0.72);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.45rem;
      backdrop-filter: blur(4px);
    }

    .zoom-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(16, 28, 48, 0.9);
      color: var(--text);
      cursor: pointer;
      font-size: 1.25rem;
    }

    .marker {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255,255,255,0.9);
      box-shadow: 0 0 12px rgba(0,0,0,0.7);
      z-index: 2;
    }

    .map-form {
      display: grid;
      grid-template-columns: 1.2fr 1.8fr auto;
      gap: 0.75rem;
      padding: 1rem;
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,0.01);
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.38rem;
    }

    .field label {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .field select,
    .field input,
    .field textarea {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(8, 17, 29, 0.95);
      color: var(--text);
      padding: 0.82rem 0.9rem;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: rgba(182, 196, 220, 0.7);
    }

    .map-list {
      padding: 0 1rem 1rem;
    }

    .entry-list {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      max-height: 220px;
      overflow-y: auto;
    }

    .entry-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.8rem;
      background: rgba(8, 17, 29, 0.8);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 0.7rem 0.8rem;
    }

    .entry-card h4 {
      margin: 0 0 0.2rem;
      font-size: 0.96rem;
    }

    .entry-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.5;
    }

    .entry-card button {
      background: transparent;
      color: var(--muted);
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
    }

    .featured-banner {
      background: linear-gradient(135deg, rgba(92,123,255,0.18), rgba(255, 255, 255, 0.02));
      border: 1px solid var(--border-strong);
      border-radius: 18px;
      padding: 1rem 1.1rem;
      box-shadow: 0 18px 32px rgba(0, 0, 0, 0.12);
    }

    .featured-banner h3 {
      margin: 0 0 0.45rem;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      color: #dce8ff;
      text-transform: uppercase;
    }

    .featured-banner .title {
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 1.8rem);
    }

    .featured-banner .text {
      margin: 0.5rem 0 0;
      color: var(--muted);
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .featured-banner img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 1rem;
      border: 1px solid var(--border);
    }

    .board-panel {
      display: flex;
      flex-direction: column;
      min-height: 760px;
    }

    .board-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .board-empty {
      padding: 1.3rem;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: rgba(10, 17, 28, 0.7);
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .post-list {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .post-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem;
      box-shadow: 0 12px 22px rgba(0,0,0,0.11);
    }

    .post-head {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 0.8rem;
    }

    .post-head h3 {
      margin: 0;
      font-size: 1.05rem;
    }

    .post-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .tiny-btn {
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(124, 156, 255, 0.08);
      color: var(--text);
      cursor: pointer;
      padding: 0.48rem 0.7rem;
      font-weight: 700;
    }

    .tiny-btn.danger {
      background: rgba(255, 106, 123, 0.09);
      border-color: rgba(255, 106, 123, 0.38);
      color: #ffd9df;
    }

    .post-card p {
      margin: 0;
      color: var(--text);
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .post-card img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      margin-top: 0.9rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(2, 6, 15, 0.73);
      z-index: 50;
      padding: 1rem;
    }

    .modal.visible {
      display: flex;
    }

    .modal-card {
      width: min(440px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.2rem;
      box-shadow: 0 26px 60px rgba(0,0,0,0.35);
    }

    .modal-card h3 {
      margin-top: 0;
      margin-bottom: 0.5rem;
    }

    .modal-card p {
      color: var(--muted);
      margin: 0 0 1rem;
      line-height: 1.5;
    }

    .modal-form {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .status {
      min-height: 1.2rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .status.error { color: #ffb1bd; }
    .status.success { color: #9af0c7; }

    @media (max-width: 980px) {
      .page-shell {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      .map-form {
        grid-template-columns: 1fr;
      }

      .brand-copy h1 {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img class="brand-logo" src="./logo.jpg" alt="POT Dino Location logo" />
        <div class="brand-copy">
          <h1>POT Dino Location</h1>
          <p>Gondwa map and community bulletin board</p>
        </div>
      </div>

      <div class="header-actions">
        <a class="btn-ghost" href="#board">Board</a>
        <button id="adminButton" class="btn" type="button">Admin portal</button>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section class="panel map-panel" aria-label="Map panel">
      <div class="panel-header">
        <h2>Gondwa map</h2>
      </div>

      <div class="map-frame">
        <div class="map-view" id="mapView">
          <div class="zoom-controls" aria-label="zoom controls">
            <button type="button" class="zoom-btn" id="zoomInBtn" aria-label="Zoom in">+</button>
            <button type="button" class="zoom-btn" id="zoomOutBtn" aria-label="Zoom out">−</button>
            <button type="button" class="zoom-btn" id="zoomResetBtn" aria-label="Reset zoom">↺</button>
          </div>
          <div class="map-layer" id="mapLayer">
            <img class="map-image" src="./gondwa-map.jpg" alt="Gondwa map" />
          </div>
        </div>
      </div>

      <div class="map-form">
        <div class="field">
          <label for="dinoSelect">Dinosaur</label>
          <select id="dinoSelect">
            <option value="Achillobator">Achillobator</option>
            <option value="Allosaurus">Allosaurus</option>
            <option value="Spinosaurus">Spinosaurus</option>
            <option value="Tyrannosaurus Rex">Tyrannosaurus Rex</option>
            <option value="Iguanodon">Iguanodon</option>
            <option value="Stegosaurus">Stegosaurus</option>
            <option value="Hatzegopteryx">Hatzegopteryx</option>
            <option value="Tylosaurus">Tylosaurus</option>
            <option value="Trike (Eotriceratops)">Trike</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="notesInput">Notes</label>
          <input id="notesInput" type="text" placeholder="Example: Adult female near the crater" />
        </div>

        <button id="saveMarkerBtn" class="btn" type="button">Save marker</button>
      </div>

      <div class="map-list">
        <div id="entriesList" class="entry-list" aria-live="polite"></div>
      </div>
    </section>

    <aside class="panel board-panel" id="board" aria-label="Bulletin board panel">
      <div class="panel-header">
        <h2>Bulletin board</h2>
      </div>

      <div class="board-body">
        <div id="featuredBanner" class="featured-banner" aria-live="polite"></div>
        <div id="postList" class="post-list" aria-live="polite"></div>
      </div>
    </aside>
  </main>

  <div id="adminModal" class="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
      <h3 id="adminTitle">Admin access</h3>
      <p>Only the authorized email can open the admin editor.</p>

      <form id="adminForm" class="modal-form">
        <div class="field">
          <label for="adminEmail">Email</label>
          <input id="adminEmail" type="email" placeholder="name@example.com" required />
        </div>

        <button type="submit" class="btn">Open admin editor</button>
        <div id="adminStatus" class="status" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <script>
    (function () {
      const ADMIN_EMAIL = 'zimaris.martinez@gmail.com';
      const ADMIN_FLAG_KEY = 'pot_admin_authorized';
      const ADMIN_EMAIL_KEY = 'pot_admin_email';
      const MAP_KEY = 'pot_dino_map_entries';
      const BOARD_KEY = 'pot_board_posts';

      const adminButton = document.getElementById('adminButton');
      const adminModal = document.getElementById('adminModal');
      const adminForm = document.getElementById('adminForm');
      const adminStatus = document.getElementById('adminStatus');
      const adminEmail = document.getElementById('adminEmail');
      const mapLayer = document.getElementById('mapLayer');
      const entriesList = document.getElementById('entriesList');
      const postList = document.getElementById('postList');
      const featuredBanner = document.getElementById('featuredBanner');
      const dinoSelect = document.getElementById('dinoSelect');
      const notesInput = document.getElementById('notesInput');
      const saveMarkerBtn = document.getElementById('saveMarkerBtn');
      const zoomInBtn = document.getElementById('zoomInBtn');
      const zoomOutBtn = document.getElementById('zoomOutBtn');
      const zoomResetBtn = document.getElementById('zoomResetBtn');

      let mapEntries = loadMapEntries();
      let boardEntries = loadBoardEntries();
      let mapZoom = 1;

      function normalizeEmail(value) {
        return String(value || '').trim().toLowerCase();
      }

      function isAdminAuthorized() {
        return localStorage.getItem(ADMIN_FLAG_KEY) === 'true' && normalizeEmail(localStorage.getItem(ADMIN_EMAIL_KEY)) === normalizeEmail(ADMIN_EMAIL);
      }

      function openModal(modal) {
        modal.classList.add('visible');
        modal.setAttribute('aria-hidden', 'false');
      }

      function closeModal(modal) {
        modal.classList.remove('visible');
        modal.setAttribute('aria-hidden', 'true');
      }

      function loadMapEntries() {
        try {
          const parsed = JSON.parse(localStorage.getItem(MAP_KEY) || '[]');
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          return [];
        }
      }

      function saveMapEntries() {
        localStorage.setItem(MAP_KEY, JSON.stringify(mapEntries));
      }

      function loadBoardEntries() {
        try {
          const parsed = JSON.parse(localStorage.getItem(BOARD_KEY) || '[]');
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          return [];
        }
      }

      function saveBoardEntries() {
        localStorage.setItem(BOARD_KEY, JSON.stringify(boardEntries));
      }

      function renderMapMarkers() {
        document.querySelectorAll('.map-marker').forEach((marker) => marker.remove());

        mapEntries.forEach((entry) => {
          const marker = document.createElement('div');
          marker.className = 'marker map-marker';
          marker.style.left = `${entry.x}%`;
          marker.style.top = `${entry.y}%`;
          marker.style.backgroundColor = entry.color || '#7c9cff';
          marker.title = `${entry.dino}${entry.notes ? ` — ${entry.notes}` : ''}`;
          mapLayer.appendChild(marker);
        });
      }

      function renderEntriesList() {
        entriesList.innerHTML = '';

        if (!mapEntries.length) {
          entriesList.innerHTML = '<div class="board-empty">No markers yet. Click anywhere on the map to add one.</div>';
          return;
        }

        mapEntries.forEach((entry, index) => {
          const card = document.createElement('div');
          card.className = 'entry-card';
          card.style.borderLeftColor = entry.color || '#7c9cff';

          const info = document.createElement('div');
          const title = document.createElement('h4');
          title.textContent = entry.dino;

          const meta = document.createElement('p');
          meta.textContent = `X: ${Number(entry.x).toFixed(1)}% • Y: ${Number(entry.y).toFixed(1)}%`;

          const note = document.createElement('p');
          note.textContent = entry.notes ? `“${entry.notes}”` : 'No notes';

          info.append(title, meta, note);

          const removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.textContent = '×';
          removeBtn.title = 'Delete marker';
          removeBtn.addEventListener('click', () => {
            mapEntries.splice(index, 1);
            saveMapEntries();
            renderMapMarkers();
            renderEntriesList();
          });

          card.append(info, removeBtn);
          entriesList.appendChild(card);
        });
      }

      function renderFeatured() {
        if (!boardEntries.length) {
          featuredBanner.innerHTML = '<h3>Featured Announcement</h3><p class="text">No announcements yet. The admin can publish the first update from the admin portal.</p>';
          return;
        }

        const latestPost = boardEntries[0];
        featuredBanner.innerHTML = `
          <h3>Featured Announcement</h3>
          <p class="title">${escapeHtml(latestPost.title || 'Announcement')}</p>
          ${latestPost.media ? `<img src="${latestPost.media}" alt="${escapeHtml(latestPost.title || 'Announcement image')}" />` : ''}
          <p class="text">${escapeHtml(latestPost.text || '')}</p>
        `;
      }

      function renderBoard() {
        postList.innerHTML = '';

        if (!boardEntries.length) {
          postList.innerHTML = '<div class="board-empty">No bulletin board posts yet. The admin can publish updates from the admin portal.</div>';
          return;
        }

        boardEntries.forEach((post) => {
          const card = document.createElement('article');
          card.className = 'post-card';

          const head = document.createElement('div');
          head.className = 'post-head';

          const title = document.createElement('h3');
          title.textContent = post.title || 'Announcement';

          const actions = document.createElement('div');
          actions.className = 'post-actions';

          const adminOnlyButtons = isAdminAuthorized();
          if (adminOnlyButtons) {
            const editBtn = document.createElement('button');
            editBtn.type = 'button';
            editBtn.className = 'tiny-btn';
            editBtn.textContent = 'Edit';
            editBtn.addEventListener('click', () => {
              window.location.href = 'admin.html?edit=' + encodeURIComponent(post.id);
            });

            const deleteBtn = document.createElement('button');
            deleteBtn.type = 'button';
            deleteBtn.className = 'tiny-btn danger';
            deleteBtn.textContent = 'Delete';
            deleteBtn.addEventListener('click', () => {
              boardEntries = boardEntries.filter((entry) => entry.id !== post.id);
              saveBoardEntries();
              renderBoard();
              renderFeatured();
            });

            actions.append(editBtn, deleteBtn);
          }

          head.append(title, actions);

          const text = document.createElement('p');
          text.textContent = post.text || '';

          card.append(head, text);

          if (post.media) {
            const image = document.createElement('img');
            image.src = post.media;
            image.alt = post.title || 'Announcement image';
            card.appendChild(image);
          }

          postList.appendChild(card);
        });
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function saveMapMarkerFromClick(clientX, clientY) {
        const rect = mapLayer.getBoundingClientRect();
        const xPercent = ((clientX - rect.left) / rect.width) * 100;
        const yPercent = ((clientY - rect.top) / rect.height) * 100;

        const selectedDino = dinoSelect.value || 'Other';
        const selectedNotes = notesInput.value.trim();
        const palette = {
          Achillobator: '#f87171',
          Allosaurus: '#ef4444',
          Spinosaurus: '#22c55e',
          'Tyrannosaurus Rex': '#f59e0b',
          Iguanodon: '#60a5fa',
          Stegosaurus: '#a78bfa',
          'Trike (Eotriceratops)': '#c084fc',
          Hatzegopteryx: '#f472b6',
          Tylosaurus: '#2dd4bf',
          Other: '#7c9cff'
        };

        mapEntries.push({
          dino: selectedDino,
          notes: selectedNotes,
          x: Math.min(Math.max(xPercent, 2), 98),
          y: Math.min(Math.max(yPercent, 2), 98),
          color: palette[selectedDino] || '#7c9cff'
        });

        saveMapEntries();
        renderMapMarkers();
        renderEntriesList();
      }

      function handleAdminSubmit(event) {
        event.preventDefault();
        const email = normalizeEmail(adminEmail.value);

        if (email !== normalizeEmail(ADMIN_EMAIL)) {
          adminStatus.textContent = 'Access denied. This portal is only available for zimaris.martinez@gmail.com.';
          adminStatus.classList.add('error');
          adminStatus.classList.remove('success');
          return;
        }

        localStorage.setItem(ADMIN_FLAG_KEY, 'true');
        localStorage.setItem(ADMIN_EMAIL_KEY, ADMIN_EMAIL);
        adminStatus.textContent = 'Access granted.';
        adminStatus.classList.remove('error');
        adminStatus.classList.add('success');

        setTimeout(() => {
          closeModal(adminModal);
          window.location.href = 'admin.html';
        }, 350);
      }

      adminButton.addEventListener('click', () => {
        if (isAdminAuthorized()) {
          window.location.href = 'admin.html';
          return;
        }
        openModal(adminModal);
      });

      adminForm.addEventListener('submit', handleAdminSubmit);
      adminModal.addEventListener('click', (event) => {
        if (event.target === adminModal) closeModal(adminModal);
      });

      saveMarkerBtn.addEventListener('click', () => {
        const rect = mapLayer.getBoundingClientRect();
        saveMapMarkerFromClick(rect.left + rect.width * 0.5, rect.top + rect.height * 0.5);
      });

      mapLayer.addEventListener('click', (event) => {
        saveMapMarkerFromClick(event.clientX, event.clientY);
      });

      zoomInBtn.addEventListener('click', () => {
        mapZoom = Math.min(mapZoom + 0.25, 2.5);
        document.querySelector('.map-image').style.transform = `scale(${mapZoom})`;
      });

      zoomOutBtn.addEventListener('click', () => {
        mapZoom = Math.max(mapZoom - 0.25, 0.75);
        document.querySelector('.map-image').style.transform = `scale(${mapZoom})`;
      });

      zoomResetBtn.addEventListener('click', () => {
        mapZoom = 1;
        document.querySelector('.map-image').style.transform = 'scale(1)';
      });

      renderMapMarkers();
      renderEntriesList();
      renderBoard();
      renderFeatured();
    })();
  </script>
</body>
</html>
